version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directories:
      - /
      - /e2e
      - /desktop/linux-preview
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      docker-images:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      # Ubuntu 26.04's libx264 crashes on arm64 VMs that advertise SVE2; see the
      # Ubuntu paragraph in docs/roadmap.md. Remove this when it is fixed.
      - dependency-name: ubuntu
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    directory: /android-tv
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      android-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
