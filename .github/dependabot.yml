version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directories:
      - /
      - /e2e
      - /desktop/linux-preview
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      docker-images:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      # Ubuntu tags are YY.MM, so Dependabot reads 24.04 -> 24.10 as a minor update. 24.10 is an
      # interim release, not an LTS, and 26.04's libx264 crashes on arm64 VMs that advertise SVE2
      # (see the Ubuntu paragraph in docs/roadmap.md). Only patch updates of the tag are wanted.
      # Remove the major rule when 26.04 is fixed.
      - dependency-name: ubuntu
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    directory: /android-tv
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      android-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
