name: Build image

# Building amd64 on the NAS is slow, and Container Manager uses the classic
# builder, where an empty ARG TARGETARCH silently drops VAAPI drivers. The
# image is built here and the NAS only pulls it. arm64 is included for Apple
# Silicon Macs -- Docker then pulls a ready image instead of emulating for
# eight minutes.
#
# Images are not built on push -- that would waste a run on every commit.
# A person starts this workflow (Actions -> Build image -> Run workflow), or
# "Release" calls it through workflow_call. Once work lands on main through
# pull requests, adding "on: push: branches: [main]" is reasonable.
on:
  workflow_dispatch:
    inputs:
      bundle:
        description: "Also attach an amd64 download tarball (docker save, ~250 MB)"
        type: boolean
        default: false
  workflow_call:
    secrets:
      DOCKER_TOKEN:
        description: "Docker Hub access token with write access to nickrabit/stremio-offline"
        required: true
    inputs:
      tags:
        description: "Extra tags besides :latest and :<sha>, space-separated"
        type: string
        default: ""
      bundle:
        type: boolean
        default: false

jobs:
  # Decides whether this run has to start CI itself. A rerun of this workflow
  # must not add a second CI run for the same commit: a successful one is
  # reused, a running one is waited on, and a failed one fails this workflow
  # without tagging an image.
  gate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.gate.outputs.reuse }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 2700 ))
          while true; do
            runs="$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&per_page=20" \
              --jq '.workflow_runs[] | "\(.status) \(.conclusion)"')"
            if printf '%s\n' "$runs" | grep -q '^completed success$'; then
              echo "reuse=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if printf '%s\n' "$runs" | grep -Eq '^(queued|in_progress|waiting|pending) '; then
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "::error::the CI run for ${GITHUB_SHA} did not finish within 45 minutes"
                exit 1
              fi
              sleep 30
              continue
            fi
            if printf '%s\n' "$runs" | grep -Eq '^completed (failure|cancelled|timed_out)$'; then
              echo "::error::the CI run for ${GITHUB_SHA} failed"
              exit 1
            fi
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            exit 0
          done

  ci:
    needs: gate
    if: needs.gate.result == 'success' && needs.gate.outputs.reuse != 'true'
    uses: ./.github/workflows/ci.yml

  # Each architecture builds on its own machine (the repository is public, so
  # a native arm64 runner is free) and is pushed to GHCR as a digest only --
  # no tag. Tags (latest, commit SHA) are applied to the combined list in the
  # "manifest" job; otherwise the second architecture would overwrite the first.
  #
  # The build no longer waits for the tests, so it overlaps them. Only
  # "manifest" applies tags, and only after both the build and the tests
  # succeeded -- an untagged digest pushed here when a test later fails is
  # simply left untagged.
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # GHCR accepts only lowercase, while github.repository keeps the owner
      # casing from GitHub. Derive the name by converting, not by hard-coding.
      - name: Set image name, build time, and a filesystem-safe platform slug
        run: |
          echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "PLATFORM_SLUG=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_TIME=${{ env.BUILD_TIME }}
            GIT_COMMIT=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_SLUG }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_SLUG }}

      - name: Store digest for the manifest job
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_SLUG }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Digests from both architectures are combined into one list, which then
  # receives the real tags. Docker picks the variant that matches the client.
  manifest:
    needs: [image, gate, ci]
    if: always() && needs.image.result == 'success' && needs.gate.result == 'success' && (needs.ci.result == 'success' || needs.ci.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      actions: read
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - id: image
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4

      # Extra tags arrive from outside (from "Release"), so they enter the
      # command through an environment variable, not by interpolating into
      # the script text.
      - name: Create and push the image index
        working-directory: /tmp/digests
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          extra=""
          for tag in $TAGS; do extra="$extra -t $IMAGE:$tag"; done
          docker buildx imagetools create \
            -t "$IMAGE:latest" \
            -t "$IMAGE:${{ github.sha }}" \
            $extra \
            $(printf "$IMAGE@sha256:%s " *)
      - run: docker buildx imagetools inspect "$IMAGE:${{ github.sha }}"

  # Drivers went missing because ARG TARGETARCH was empty; to catch that
  # again, the finished amd64 image is checked immediately. arm64 is not
  # checked -- the Dockerfile deliberately skips drivers there, QuickSync
  # does not run on that machine.
  verify:
    needs: manifest
    # A reused CI run leaves `ci` skipped. Without an explicit condition GitHub then
    # skips this job too, even though manifest itself succeeded.
    if: ${{ !cancelled() && needs.manifest.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      # The verify job runs on a different machine than the build, so login
      # has to be repeated -- credentials from the earlier "docker login"
      # are not shared with it.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check VAAPI drivers in the amd64 image
        run: |
          IMAGE="${{ needs.manifest.outputs.image }}"
          docker pull --platform linux/amd64 "$IMAGE:${{ github.sha }}"
          drivers=$(docker run --rm --platform linux/amd64 "$IMAGE:${{ github.sha }}" sh -lc 'ls /usr/lib/x86_64-linux-gnu/dri/ | grep drv_video | tr "\n" " "')
          echo "Drivers found: $drivers"
          case "$drivers" in
            *iHD_drv_video.so*) ;;
            *) echo "::error::VAAPI drivers are missing from the amd64 image, QuickSync would not run on a NAS."; exit 1 ;;
          esac

      - name: Pack amd64 for download
        if: inputs.bundle
        run: |
          mkdir -p dist
          docker save "${{ needs.manifest.outputs.image }}:${{ github.sha }}" | gzip -1 > dist/stremio-offline-amd64.tar.gz
      - uses: actions/upload-artifact@v7
        if: inputs.bundle
        with:
          name: stremio-offline-amd64
          path: dist/stremio-offline-amd64.tar.gz
          retention-days: 14

  docker-hub:
    needs: [manifest, verify]
    if: ${{ !cancelled() && needs.manifest.result == 'success' && needs.verify.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      SOURCE_IMAGE: ${{ needs.manifest.outputs.image }}
      DOCKER_IMAGE: docker.io/nickrabit/stremio-offline
      COMMIT: ${{ github.sha }}
      TAGS: ${{ inputs.tags }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          username: nickrabit
          password: ${{ secrets.DOCKER_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Copy the verified multi-platform image to Docker Hub
        run: |
          set -euo pipefail
          tags=(-t "$DOCKER_IMAGE:latest" -t "$DOCKER_IMAGE:$COMMIT")
          for tag in $TAGS; do tags+=(-t "$DOCKER_IMAGE:$tag"); done
          docker buildx imagetools create "${tags[@]}" "$SOURCE_IMAGE:$COMMIT"
      - name: Verify both Docker Hub architectures
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$DOCKER_IMAGE:$COMMIT" --raw | jq -e '
            any(.manifests[]; .platform.os == "linux" and .platform.architecture == "amd64") and
            any(.manifests[]; .platform.os == "linux" and .platform.architecture == "arm64")
          '
      - uses: actions/checkout@v7
      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@432a30c9e07499fd01da9f8a49f0faf9e0ca5b77 # v4
        with:
          username: nickrabit
          password: ${{ secrets.DOCKER_TOKEN }}
          repository: nickrabit/stremio-offline
          short-description: "Self-hosted Stremio addon client with streaming, offline downloads and personal media libraries."
          readme-filepath: docs/docker-hub.md
