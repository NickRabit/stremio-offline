# Screenshot baselines are only comparable when every one of them is produced in
# the same place. Regenerating them by hand means remembering to use the
# container; this does it, and pushes the result back to the branch.
name: Update screenshot baselines

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to regenerate the baselines on"
        type: string
        required: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      # The fixture builds its test media with ffmpeg, which the Playwright image
      # does not carry. Without this the web server never starts and the run dies
      # before it renders anything. The e2e job in ci.yml installs it the same way.
      - run: apt-get update && apt-get install -y --no-install-recommends ffmpeg
      - run: npx playwright test --update-snapshots
        env:
          HOME: /root
      - name: Commit the new baselines
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Staged first, then compared. `git diff` alone does not see an untracked
          # file, so a viewport added to the matrix produced baselines that this step
          # reported as "already match" and threw away, leaving a green run and a red
          # pull request. The path keeps the -A to the baselines.
          git add -A -- e2e/tests/layout/__screenshots__
          if git diff --cached --quiet -- e2e/tests/layout/__screenshots__; then
            echo "Baselines already match; nothing to commit."
            exit 0
          fi
          git commit -m "test: refresh screenshot baselines"
          git push origin HEAD:${{ inputs.branch }}
