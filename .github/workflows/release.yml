name: Release

# Tag a commit and the rest is automatic: this job calls "Build image", so the
# published version is built and tested from the same commit the tag points
# at -- nothing to mix up. Beside :latest and :<sha> from the image build,
# :<version> and :<major.minor> are added.
#
# Release: git tag v0.4.0 && git push origin v0.4.0
on:
  push:
    tags: ["v*.*.*"]

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      minor: ${{ steps.v.outputs.minor }}
    steps:
      - uses: actions/checkout@v7
      # Before anything is built or published: the desktop jobs refuse a tag their manifest
      # does not carry, and by then the image and the release would already be out.
      - run: node scripts/check-versions.mjs "${GITHUB_REF_NAME}"
      - id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"

  image:
    needs: version
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
      actions: read
    with:
      tags: "${{ needs.version.outputs.version }} ${{ needs.version.outputs.minor }}"

  # The GitHub Release is created only after a successful build, so the
  # releases list never shows a version whose image failed to build.
  release:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create GitHub Release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes --title "${{ github.ref_name }}"

  # The Android TV APK, signed with the project's release key from the
  # ANDROID_KEYSTORE_BASE64 secret. A missing secret is not a failure: the image
  # and the desktop packages must ship anyway, and an unsigned or differently
  # signed APK would fail as an update on every television. The job only uploads
  # an asset -- it never edits the release notes -- so it can run beside the
  # desktop jobs.
  android:
    needs: [version, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Check for the signing key
        id: key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::notice title=No TV APK::ANDROID_KEYSTORE_BASE64 is not set, so this release has no TV APK and Obtainium will skip it."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.key.outputs.signed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - if: steps.key.outputs.signed == 'true'
        uses: android-actions/setup-android@v3
        with:
          # The default list still names the retired `tools` package, which sdkmanager now refuses.
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Build, verify and attach the signed APK
        if: steps.key.outputs.signed == 'true'
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          # Optional repository variable: the SHA-256 of the signing certificate as
          # `apksigner --print-certs` prints it. Set it so a rotated or mis-set keystore cannot
          # publish an APK every television refuses as an update.
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE"
          chmod 600 "$ANDROID_KEYSTORE"
          ( cd android-tv && ./gradlew assembleRelease --no-daemon )
          apk="android-tv/app/build/outputs/apk/release/app-release.apk"
          # `apksigner` sits in build-tools, which setup-android does not put on PATH.
          certs="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk")"
          printf '%s\n' "$certs"
          if [ -n "${ANDROID_CERT_SHA256:-}" ]; then
            if ! printf '%s\n' "$certs" | grep -qiF "SHA-256 digest: $ANDROID_CERT_SHA256"; then
              echo "::error title=Wrong signing certificate::the APK is not signed with the certificate ANDROID_CERT_SHA256 pins; refusing to publish it."
              exit 1
            fi
          else
            echo "::warning title=Unpinned TV certificate::ANDROID_CERT_SHA256 is not set, so the APK's certificate was not compared against a pinned one. Pin it with: gh variable set ANDROID_CERT_SHA256"
          fi
          cp "$apk" "stremio-offline-tv-${VERSION}.apk"
          # `gh release upload` fails on an asset name that is already there, so a
          # rerun never replaces what was published.
          present="$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name')"
          if printf '%s\n' "$present" | grep -qxF -e "stremio-offline-tv-${VERSION}.apk"; then
            echo "::warning title=TV APK already attached::the release already carries stremio-offline-tv-${VERSION}.apk; the upload never replaces what is published, so a wrong or truncated asset has to be deleted by hand before a rerun."
          else
            gh release upload "${GITHUB_REF_NAME}" "stremio-offline-tv-${VERSION}.apk"
          fi
          rm -f "$ANDROID_KEYSTORE"

  # The macOS app goes onto the same release, unsigned: there is no Developer ID
  # yet, so the bundle is ad-hoc signed as in "Desktop package" and the asset
  # names say so. It runs after the release exists, and a failure here leaves
  # the release and its image as they are.
  desktop:
    needs: release
    # Apple Silicon, so the arm64 build runs natively.
    runs-on: macos-14
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Tag and desktop version agree
        run: |
          set -euo pipefail
          manifest="$(node -p 'require("./desktop/package.json").version')"
          if [ "v$manifest" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match desktop/package.json $manifest"
            exit 1
          fi
      # The LGPL FFmpeg takes minutes to build; the result only changes with the script.
      - uses: actions/cache@v6
        with:
          path: desktop/ffmpeg
          key: desktop-ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/scripts/build-ffmpeg.sh') }}
      - run: npm ci
      - run: npm run package:mac:arm64 -w desktop
      - run: npm run verify:fuses -w desktop
      - run: npm run smoke:packaged -w desktop
      - name: Name the artifacts as unsigned
        run: |
          set -euo pipefail
          cd desktop/release
          for file in Stremio-Offline-*-arm64.dmg Stremio-Offline-*-arm64.zip; do
            mv "$file" "${file%.*}-unsigned.${file##*.}"
          done
          ls -l ./*-unsigned.*
      # `gh release upload` fails on an asset name that is already there, so a
      # rerun never replaces what was published.
      - name: Attach the app to the release
        env:
          GH_TOKEN: ${{ github.token }}
        # The app carries an LGPL FFmpeg statically linked with OpenSSL, so the exact source
        # archives it was built from travel with the same release (see docs/licensing.md).
        run: gh release upload "${GITHUB_REF_NAME}" desktop/release/*-unsigned.dmg desktop/release/*-unsigned.zip desktop/ffmpeg/sources/*
  # The LGPL FFmpeg the Windows app carries, cross-built with mingw-w64 exactly as the
  # pull-request check builds it.
  ffmpeg-windows:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # The LGPL FFmpeg takes minutes to build; the result only changes with the script.
      - uses: actions/cache@v6
        with:
          path: desktop/ffmpeg-win
          key: desktop-ffmpeg-win-${{ hashFiles('desktop/scripts/build-ffmpeg-win.sh') }}
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64 nasm pkg-config make xz-utils curl libz-mingw-w64-dev
      - run: bash desktop/scripts/build-ffmpeg-win.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-windows
          path: desktop/ffmpeg-win
          if-no-files-found: error
          retention-days: 7

  # The Windows x64 app, unsigned like the macOS one. The package jobs upload
  # distinct asset names, so they run beside each other; "release-notes" is the
  # only job that edits the release body.
  desktop-windows:
    needs: [release, ffmpeg-windows]
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    # Git Bash is the shell the runner has that behaves like the macOS job's.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Tag and desktop version agree
        run: |
          set -euo pipefail
          manifest="$(node -p 'require("./desktop/package.json").version')"
          if [ "v$manifest" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match desktop/package.json $manifest"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: ffmpeg-windows
          path: desktop/ffmpeg-win
      - run: npm ci
      - run: npm run package:win:x64 -w desktop
      - run: npm run verify:fuses -w desktop
      - run: npm run smoke:packaged -w desktop
      - name: Name the artifacts as unsigned
        run: |
          set -euo pipefail
          cd desktop/release
          for file in Stremio-Offline-*-x64.exe; do
            mv "$file" "${file%.exe}-unsigned-setup.exe"
          done
          for file in Stremio-Offline-*-x64.zip; do
            mv "$file" "${file%.zip}-unsigned.zip"
          done
          ls -l ./*-unsigned*
      # `gh release upload` fails on an asset name that is already there, so a rerun never
      # replaces what was published.
      - name: Attach the app to the release
        env:
          GH_TOKEN: ${{ github.token }}
        # A rerun after a later step failed finds the app attached already; that is done, not an error.
        run: |
          set -euo pipefail
          present="$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name')"
          files=()
          for file in desktop/release/*-unsigned-setup.exe desktop/release/*-unsigned.zip; do
            if printf '%s\n' "$present" | grep -qxF -e "$(basename "$file")"; then
              echo "the release already carries $(basename "$file")"
              continue
            fi
            files+=("$file")
          done
          if [ ${#files[@]} -gt 0 ]; then gh release upload "${GITHUB_REF_NAME}" "${files[@]}"; fi
      # The Windows sources share the FFmpeg tarball's name with the macOS job's, which has
      # already run, so only names the release does not have yet are uploaded.
      - name: Attach the FFmpeg sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          present="$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name')"
          files=()
          for file in desktop/ffmpeg-win/sources/*; do
            name="$(basename "$file")"
            if printf '%s\n' "$present" | grep -qxF -e "$name"; then
              echo "the release already carries $name"
              continue
            fi
            files+=("$file")
          done
          if [ ${#files[@]} -eq 0 ]; then
            echo "every source archive is already attached"
            exit 0
          fi
          if ! gh release upload "${GITHUB_REF_NAME}" "${files[@]}" 2>"$RUNNER_TEMP/source-upload.err"; then
            if grep -qi "already exists" "$RUNNER_TEMP/source-upload.err"; then
              echo "an asset was already attached; treating it as success"
              cat "$RUNNER_TEMP/source-upload.err"
              exit 0
            fi
            cat "$RUNNER_TEMP/source-upload.err" >&2
            exit 1
          fi
  # The LGPL FFmpeg the Linux app carries, built in the same pinned ubuntu:22.04 container as the
  # pull-request check builds it.
  ffmpeg-linux:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # The LGPL FFmpeg takes minutes to build; the result only changes with the script.
      - uses: actions/cache@v6
        with:
          path: desktop/ffmpeg-linux
          key: desktop-ffmpeg-linux-${{ hashFiles('desktop/scripts/build-ffmpeg-linux.sh') }}
      - run: bash desktop/scripts/build-ffmpeg-linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-linux
          path: desktop/ffmpeg-linux
          if-no-files-found: error
          retention-days: 7

  # The Linux x64 AppImage and .deb, unsigned like the macOS and Windows ones. The package jobs
  # upload distinct asset names, so they run beside each other; "release-notes" is the only job
  # that edits the release body.
  desktop-linux:
    needs: [release, ffmpeg-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Tag and desktop version agree
        run: |
          set -euo pipefail
          manifest="$(node -p 'require("./desktop/package.json").version')"
          if [ "v$manifest" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match desktop/package.json $manifest"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: ffmpeg-linux
          path: desktop/ffmpeg-linux
      # An artifact download loses the executable bit.
      - run: chmod +x desktop/ffmpeg-linux/ffmpeg desktop/ffmpeg-linux/ffprobe
      - run: npm ci
      # The system libraries the bundled FFmpeg links against: libva and libdrm must match the
      # machine's own GPU driver, so they come from the system, as the .deb's dependencies say.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libva2 libva-drm2 libdrm2
      - run: npm run package:linux:x64 -w desktop
      # Both checks start the packaged app, which needs a display; the runner has no screen.
      - run: xvfb-run -a npm run verify:fuses -w desktop
      - run: xvfb-run -a npm run smoke:packaged -w desktop
        env:
          # Ubuntu 24.04 runners restrict unprivileged user namespaces, and the unpacked app has
          # no SUID sandbox, so the browser cannot start without this.
          ELECTRON_DISABLE_SANDBOX: "1"
      - name: Name the artifacts as unsigned
        run: |
          set -euo pipefail
          version="$(node -p 'require("./desktop/package.json").version')"
          for file in desktop/release/*.AppImage; do
            mv "$file" "${file%.AppImage}-unsigned.AppImage"
          done
          # electron-builder names the .deb with linux.artifactName; the release gives it Debian's
          # fixed name docs/install-linux.md tells people to install.
          for file in desktop/release/*.deb; do
            mv "$file" "desktop/release/stremio-offline_${version}_amd64-unsigned.deb"
          done
          ls -l desktop/release/*-unsigned*
      # `gh release upload` fails on an asset name that is already there, so a rerun never
      # replaces what was published.
      - name: Attach the app to the release
        env:
          GH_TOKEN: ${{ github.token }}
        # A rerun after a later step failed finds the app attached already; that is done, not an error.
        run: |
          set -euo pipefail
          present="$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name')"
          files=()
          for file in desktop/release/*-unsigned.AppImage desktop/release/*-unsigned.deb; do
            if printf '%s\n' "$present" | grep -qxF -e "$(basename "$file")"; then
              echo "the release already carries $(basename "$file")"
              continue
            fi
            files+=("$file")
          done
          if [ ${#files[@]} -gt 0 ]; then gh release upload "${GITHUB_REF_NAME}" "${files[@]}"; fi
      # The Linux sources share the FFmpeg tarball's name with the macOS and Windows jobs' ones,
      # which have already run, so only names the release does not have yet are uploaded.
      - name: Attach the FFmpeg sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          present="$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name')"
          files=()
          for file in desktop/ffmpeg-linux/sources/*; do
            name="$(basename "$file")"
            if printf '%s\n' "$present" | grep -qxF -e "$name"; then
              echo "the release already carries $name"
              continue
            fi
            files+=("$file")
          done
          if [ ${#files[@]} -eq 0 ]; then
            echo "every source archive is already attached"
            exit 0
          fi
          if ! gh release upload "${GITHUB_REF_NAME}" "${files[@]}" 2>"$RUNNER_TEMP/source-upload.err"; then
            if grep -qi "already exists" "$RUNNER_TEMP/source-upload.err"; then
              echo "an asset was already attached; treating it as success"
              cat "$RUNNER_TEMP/source-upload.err"
              exit 0
            fi
            cat "$RUNNER_TEMP/source-upload.err" >&2
            exit 1
          fi

  # The only job that edits the release body. The three sections are appended in
  # macOS, Windows, Linux order, because each step adds to whatever the release
  # already carries.
  release-notes:
    needs: [desktop, desktop-windows, desktop-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      # This job does not check the repository out, so gh cannot discover it from git.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Say how to open it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          gh release view "${GITHUB_REF_NAME}" --json body --jq .body > "$notes"
          # A rerun must not add the section twice. The Windows and Linux steps
          # already refuse that; this one job now appends all three.
          if grep -qF "## Desktop app (macOS, Apple Silicon)" "$notes"; then
            echo "the release notes already describe the macOS app"
            exit 0
          fi
          cat >> "$notes" <<'NOTES'

          ## Desktop app (macOS, Apple Silicon)

          `Stremio-Offline-<version>-arm64-unsigned.dmg` is not signed with an Apple Developer ID, so macOS refuses the first launch. Allow it once in **System Settings → Privacy & Security → Open Anyway** (on macOS 14 and older, right-click the app → **Open**). [docs/install-mac.md](https://github.com/NickRabit/stremio-offline/blob/main/docs/install-mac.md) walks through it.

          The app includes FFmpeg, built LGPL-3.0-or-later with OpenSSL; the `ffmpeg-*` and `openssl-*` archives attached here are the exact sources it was built from (see `docs/licensing.md`).
          NOTES
          gh release edit "${GITHUB_REF_NAME}" --notes-file "$notes"
      - name: Say how to install it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes-windows.md"
          gh release view "${GITHUB_REF_NAME}" --json body --jq .body > "$notes"
          # A rerun must not add the section twice.
          if grep -qF "## Desktop app (Windows x64)" "$notes"; then
            echo "the release notes already describe the Windows app"
            exit 0
          fi
          cat >> "$notes" <<'NOTES'

          ## Desktop app (Windows x64)

          `Stremio-Offline-<version>-x64-unsigned-setup.exe` is not signed, so Microsoft Defender SmartScreen stops the first launch: choose **More info** → **Run anyway**. [docs/install-windows.md](https://github.com/NickRabit/stremio-offline/blob/main/docs/install-windows.md) walks through the install.

          The app includes FFmpeg, built LGPL-3.0-or-later for Windows; the `ffmpeg-*` source archive attached here is the exact source it was built from (see `docs/licensing.md`).
          NOTES
          gh release edit "${GITHUB_REF_NAME}" --notes-file "$notes"
      - name: Say how to install it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes-linux.md"
          gh release view "${GITHUB_REF_NAME}" --json body --jq .body > "$notes"
          # A rerun must not add the section twice.
          if grep -qF "## Desktop app (Linux x64)" "$notes"; then
            echo "the release notes already describe the Linux app"
            exit 0
          fi
          cat >> "$notes" <<'NOTES'

          ## Desktop app (Linux x64)

          `stremio-offline_<version>_amd64-unsigned.deb` installs on Ubuntu and Debian with `sudo apt install ./stremio-offline_<version>_amd64-unsigned.deb`. `Stremio-Offline-<version>-x86_64-unsigned.AppImage` is one file with no install, for every other distribution. [docs/install-linux.md](https://github.com/NickRabit/stremio-offline/blob/main/docs/install-linux.md) walks through both.

          The app includes FFmpeg, built LGPL-3.0-or-later for Linux with VA-API and NVENC; the `ffmpeg-*`, `openssl-*` and `nv-codec-headers-*` archives attached here are the exact sources it was built from (see `docs/licensing.md`).
          NOTES
          gh release edit "${GITHUB_REF_NAME}" --notes-file "$notes"
