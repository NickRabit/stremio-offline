# Runs on every pull request. The image workflow calls it as well, so the
# release path checks the same things without repeating them here.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      # A bump that misses one manifest only fails the release's desktop job, after the
      # image is out. Here it fails the pull request instead.
      - run: node scripts/check-versions.mjs
      - run: node --test scripts/check-versions.test.mjs
      - run: node --test scripts/media-server-spike.test.mjs
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run build -w @stremio-offline/source-selection
      - run: npx tsc -p desktop
      - run: npx tsc --noEmit -p server
      - run: npx tsc --noEmit -p e2e
      # "npm run build" type-checks the web workspace on its way through, and
      # the bundle is otherwise only built inside the image -- which never runs
      # on a pull request.
      - run: npm run build
      - run: npm test

  # The server and the desktop shell are what the Windows app runs, and neither had ever been
  # built there. The web suite and the browser end-to-end run are platform-neutral, and the
  # browser image is Linux-only by design, so this job leaves them out.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run build -w @stremio-offline/source-selection
      - run: npx tsc -p desktop
      - run: npx tsc --noEmit -p server
      - run: npm run test -w server
      - run: npm run test -w desktop

  # The Playwright container carries the browser and its system libraries, so the
  # same image is used locally when baselines are involved. See docs/testing.md.
  e2e:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run build
      - run: apt-get update && apt-get install -y --no-install-recommends ffmpeg
      - run: npx playwright test --project=chromium
        env:
          HOME: /root
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The WebKit journeys, the two mobile-locale checks and the two files that talk to the addon and
  # the proxy over HTTP were part of the job above, where they waited for the whole chromium suite
  # -- five minutes of page launches -- to finish first. None of them needs anything the journeys
  # build: the account setup leaves is enough, so they run beside it instead of after it.
  e2e-browsers:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run build
      - run: apt-get update && apt-get install -y --no-install-recommends ffmpeg
      - run: npx playwright test --project=chromium-transport --project=safari-seek --project=safari-landscape --project=safari-queue --project=mobile-locales
        env:
          HOME: /root
          # One project subset per job: the seed is the state builder, not the journeys.
          LAYOUT_SEED_ONLY: "1"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-browsers
          path: playwright-report/
          retention-days: 7

  # Every layout viewport would otherwise queue behind the other six on one server.
  # Each job runs "setup" and the layout seed, and the seed is what the baselines are
  # taken against: a library with the fixture titles in it, built through the API in
  # seconds. The chromium journeys used to be that state's builder, which cost every
  # viewport a replay of the whole journey suite -- around two minutes per job.
  e2e-layout:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    strategy:
      fail-fast: false
      # Keep this list equal to the `name` fields of `viewports` in playwright.config.ts.
      matrix:
        project: [desktop, desktop-short, tablet-landscape, tablet, mobile, mobile-landscape, mobile-landscape-small]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run build
      - run: apt-get update && apt-get install -y --no-install-recommends ffmpeg
      - run: npx playwright test --project=${{ matrix.project }}
        env:
          HOME: /root
          # One viewport per job: the seed is the state builder, not the journeys.
          LAYOUT_SEED_ONLY: "1"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-layout-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7
