# Runs on every pull request. The image workflow calls it as well, so the
# release path checks the same things without repeating them here.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npx tsc -p desktop
      - run: npx tsc --noEmit -p server
      - run: npx tsc --noEmit -p e2e
      # "npm run build" type-checks the web workspace on its way through, and
      # the bundle is otherwise only built inside the image -- which never runs
      # on a pull request.
      - run: npm run build
      - run: npm test

  # The Playwright container carries the browser and its system libraries, so the
  # same image is used locally when baselines are involved. See docs/testing.md.
  e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run build
      - run: apt-get update && apt-get install -y --no-install-recommends ffmpeg
      - run: npx playwright test
        env:
          HOME: /root
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
