# The Android TV project is a separate Gradle build, so it is left out of the
# Node jobs in ci.yml and gets its own run. The paths filter keeps it off pull
# requests that touch nothing here; package.json is in the list because the
# app's versionName and versionCode are read from it.
name: Android TV

on:
  pull_request:
    paths:
      - "android-tv/**"
      - ".github/workflows/android-tv.yml"
      - "package.json"
      - "web/src/i18n/**"
      - "scripts/android-strings.mjs"
      - "android-tv/strings.keys"
  push:
    branches: [main]
    paths:
      - "android-tv/**"
      - ".github/workflows/android-tv.yml"
      - "package.json"
      - "web/src/i18n/**"
      - "scripts/android-strings.mjs"
      - "android-tv/strings.keys"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          # The default list still names the retired `tools` package, which sdkmanager now refuses.
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/android-strings.mjs --check
      # assembleRelease also runs R8, so the minified build is proven on every change.
      - run: ./gradlew assembleDebug assembleRelease testDebugUnitTest lintDebug --no-daemon
        working-directory: android-tv
      # One of the four signing variables on its own must not break the build: the signing config
      # is created only when all four are set, so this still produces the unsigned APK.
      - run: ANDROID_KEYSTORE="$RUNNER_TEMP/absent.keystore" ./gradlew :app:assembleRelease --no-daemon
        working-directory: android-tv
