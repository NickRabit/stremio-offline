name: Desktop package

# Packages the macOS arm64 prototype from the desktop workspace. This is a
# packaging check, not a release: the artifacts have no Developer ID identity,
# are not notarized and are only uploaded to the workflow run. It stays
# credentials-free on purpose; the signed, notarized release path is the manual
# "Desktop release" workflow (.github/workflows/desktop-release.yml). See
# desktop/README.md.
on:
  pull_request:
    paths:
      - "desktop/**"
      - "desktop/scripts/build-ffmpeg-win.sh"
      - "server/**"
      - "web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop-package.yml"
      - ".github/workflows/desktop-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Builds the LGPL FFmpeg for Windows x64 with the mingw-w64 cross toolchain. The artifact is
  # consumed by the Windows packaging job (win-package), which runs it on a Windows runner.
  ffmpeg-windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The LGPL FFmpeg takes minutes to build; the result only changes with the script.
      - uses: actions/cache@v4
        with:
          path: desktop/ffmpeg-win
          key: desktop-ffmpeg-win-${{ hashFiles('desktop/scripts/build-ffmpeg-win.sh') }}
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64 nasm pkg-config make xz-utils curl libz-mingw-w64-dev
      - run: bash desktop/scripts/build-ffmpeg-win.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows
          path: desktop/ffmpeg-win
          if-no-files-found: error
          retention-days: 7

  package:
    # macos-14 is an Apple Silicon runner, so the arm64 Electron build runs
    # natively and can be handed to hdiutil for the DMG.
    runs-on: macos-14
    env:
      # Discovery is off, so this check is always unsigned and never needs an
      # Apple certificate or notarization credentials.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # The LGPL FFmpeg takes minutes to build; the result only changes with the script.
      - uses: actions/cache@v4
        with:
          path: desktop/ffmpeg
          key: desktop-ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/scripts/build-ffmpeg.sh') }}
      - run: npm ci
      - run: npm run package:mac:arm64 -w desktop
      # Read the fuses back from the packaged .app, so a build with an
      # unconfigured fuse fails here instead of being uploaded.
      - run: npm run verify:fuses -w desktop
      # The packaged app runs the staged server from inside the archive and proves the
      # production dependencies came along, before anything is uploaded.
      - run: npm run smoke:packaged -w desktop
      - uses: actions/upload-artifact@v4
        with:
          name: stremio-offline-macos-arm64-dmg
          path: desktop/release/*.dmg
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: stremio-offline-macos-arm64-zip
          path: desktop/release/*.zip
          if-no-files-found: error
          retention-days: 7
