services:
  stremio-offline:
    build: .
    image: stremio-offline:local
    container_name: stremio-offline
    restart: unless-stopped
    init: true
    ports:
      - "${STREMIO_OFFLINE_PORT:-8090}:8080"
    environment:
      TZ: "${TZ:-Europe/Prague}"
      # Who to run as. On Synology, set these to the download-folder owner.
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      FIX_PERMISSIONS: "${FIX_PERMISSIONS:-0}"
      DATA_DIR: /data
      DOWNLOAD_DIR: /downloads
      # How much to log: DEBUG adds requests and playback progress.
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LOG_MAX_BYTES: "${LOG_MAX_BYTES:-5242880}"
      LOG_RETENTION_DAYS: "${LOG_RETENTION_DAYS:-7}"
      # Disk the server-side artwork cache may take (Settings -> Privacy).
      IMAGE_CACHE_MB: "${IMAGE_CACHE_MB:-512}"
      # Age at which a cached addon image is dropped even under that limit. 0 keeps the
      # cap-only behaviour.
      IMAGE_CACHE_TTL_DAYS: "${IMAGE_CACHE_TTL_DAYS:-0}"
      # Disk the thumbnails generated for the library (data/artwork) may take.
      ARTWORK_CACHE_MB: "${ARTWORK_CACHE_MB:-256}"
      # Days after which the scan re-reads a bound series; 0 switches the pass off.
      LIBRARY_META_TTL_DAYS: "${LIBRARY_META_TTL_DAYS:-14}"
      # Roots a library may be added from. Empty keeps the download directory as the
      # only one; add the extra mounts here, the download directory included, for
      # example "/downloads,/libraries/datacenter".
      LIBRARY_ROOTS: "${LIBRARY_ROOTS:-}"
      ALLOW_PRIVATE_ADDONS: "${ALLOW_PRIVATE_ADDONS:-0}"
      ALLOW_ADDON_HOSTS: "${ALLOW_ADDON_HOSTS:-}"
      RESTRICTED_MODE: "${RESTRICTED_MODE:-0}"
      # Guarding addon requests: a cap on concurrent requests per host and a pause
      # after repeated failures. ADDON_GUARD=0 turns both off.
      ADDON_GUARD: "${ADDON_GUARD:-1}"
      ADDON_MAX_CONCURRENT: "${ADDON_MAX_CONCURRENT:-8}"
      ADDON_MAX_QUEUE: "${ADDON_MAX_QUEUE:-256}"
      ADDON_MIN_INTERVAL_MS: "${ADDON_MIN_INTERVAL_MS:-0}"
      ADDON_BREAKER_FAILURES: "${ADDON_BREAKER_FAILURES:-5}"
      ADDON_BREAKER_COOLDOWN_MS: "${ADDON_BREAKER_COOLDOWN_MS:-30000}"
      ADDON_BREAKER_MAX_COOLDOWN_MS: "${ADDON_BREAKER_MAX_COOLDOWN_MS:-300000}"
      FFMPEG_PRESET: "${FFMPEG_PRESET:-veryfast}"
      FFMPEG_CRF: "${FFMPEG_CRF:-23}"
      VAAPI_QP: "${VAAPI_QP:-23}"
      FFMPEG_READRATE: "${FFMPEG_READRATE:-1.5}"
      FFMPEG_READRATE_REMUX: "${FFMPEG_READRATE_REMUX:-3}"
      VAAPI_DEVICE: "${VAAPI_DEVICE:-}"
      # Group that owns the render node. Without it, after switching to
      # PUID/PGID the process cannot open /dev/dri; in the container
      # terminal: ls -n /dev/dri
      RENDER_GID: "${RENDER_GID:-}"
      # Some setups do not pick a driver on their own; iHD for newer Intel,
      # i965 for older.
      LIBVA_DRIVER_NAME: "${LIBVA_DRIVER_NAME:-}"
    # Hardware conversion on Synology with an Intel iGPU (QuickSync).
    #
    # From the command line, add the override:
    #   docker compose -f compose.yml -f compose.synology.yml up -d --build
    #
    # DSM Container Manager accepts only ONE compose file, so there, instead
    # of the override, uncomment these two lines and set both in .env:
    #   VAAPI_DEVICE=/dev/dri/renderD128
    #   RENDER_GID=937          (from ls -n /dev/dri, see above)
    #
    # devices:
    #   - /dev/dri:/dev/dri
    # Software transcode takes every core and DSM then stops responding. On a
    # weaker NAS, uncomment and leave one core for the system (e.g. 3 of 4).
    #
    # cpus: "3.0"
    # Restart policy is only useful when it is clear that the server is alive.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      # Server data (account, addons, artwork, stats) live in an ordinary
      # folder, not a hidden Docker volume -- back it up or inspect it like
      # anything else.
      - "${DATA_PATH:-./data}:/data"
      - "${DOWNLOAD_PATH:-./downloads}:/downloads"
      # A second library on another disk. Point EXTRA_LIBRARY_PATH at it (a NAS
      # share, an external drive) and list the container path in LIBRARY_ROOTS --
      # a mount alone grants nothing. The default keeps an empty folder next to
      # the download directory, so the mount is always valid.
      - "${EXTRA_LIBRARY_PATH:-./datacenter}:/libraries/datacenter"
