<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title></title>
  <style>
    html, body { margin: 0; height: 100%; background: #101014; color: #f2f2f4; font: 14px/1.4 system-ui, sans-serif; }
    main { display: flex; flex-direction: column; gap: 10px; padding: 32px; box-sizing: border-box; }
    h1 { margin: 0; font-size: 18px; }
    label { font-size: 12px; opacity: 0.7; }
    input, select { width: 360px; padding: 8px; border: 1px solid #3a3a44; border-radius: 6px; background: #191920; color: inherit; font: inherit; }
    button { padding: 8px 14px; border: 1px solid #3a3a44; border-radius: 6px; background: #232331; color: inherit; font: inherit; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
    #form { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
    #actions, #local-actions { display: flex; gap: 8px; }
    #local-lan { display: flex; flex-direction: column; gap: 4px; max-width: 360px; }
    #local-lan label { display: flex; align-items: center; gap: 6px; font-size: 13px; opacity: 1; }
    #local-lan input { width: auto; padding: 0; border: 0; background: none; }
    #local-lan p { margin: 0; font-size: 12px; opacity: 0.6; }
    #local-publish { display: flex; flex-direction: column; gap: 4px; max-width: 360px; }
    #local-publish label.publish-toggle { display: flex; align-items: center; gap: 6px; font-size: 13px; opacity: 1; }
    #local-publish input[type="checkbox"] { width: auto; padding: 0; border: 0; background: none; }
    #publishPort { width: 120px; }
    #local-publish p { margin: 0; font-size: 12px; opacity: 0.6; }
    #hint { margin: 0; font-size: 12px; opacity: 0.6; }
    #message { margin: 0; }
    body.connected main { flex-direction: row; align-items: center; gap: 12px; height: 48px; padding: 0 14px; }
    body.connected h1 { font-size: 13px; }
    body.connected #form { display: none; }
  </style>
</head>
<body>
  <main>
    <h1 data-i18n="connect.title"></h1>
    <div id="form">
      <label for="profiles" data-i18n="connect.profiles"></label>
      <select id="profiles"></select>
      <label for="profileName" data-i18n="connect.profileName"></label>
      <input id="profileName" type="text" maxlength="80" autocomplete="off" spellcheck="false" />
      <label for="origin" data-i18n="connect.address"></label>
      <input id="origin" type="url" autocomplete="off" spellcheck="false" />
      <p id="hint" data-i18n="connect.addressHint"></p>
      <div id="actions">
        <button id="save" type="button" data-i18n="connect.profileSave"></button>
        <button id="remove" type="button" data-i18n="connect.profileRemove"></button>
        <button id="connect" type="button" data-i18n="connect.connect"></button>
      </div>
      <div id="local-actions">
        <button id="local" type="button" data-i18n="connect.local"></button>
      </div>
      <div id="local-lan">
        <label for="localLan"><input id="localLan" type="checkbox" /><span data-i18n="connect.localLan"></span></label>
        <p data-i18n="connect.localLanHint"></p>
      </div>
      <div id="local-publish">
        <label class="publish-toggle" for="publish"><input id="publish" type="checkbox" /><span data-i18n="connect.publish"></span></label>
        <label for="publishPort" data-i18n="connect.publishPort"></label>
        <input id="publishPort" type="number" min="1024" max="65535" step="1" inputmode="numeric" />
        <p data-i18n="connect.publishHint"></p>
      </div>
    </div>
    <button id="disconnect" type="button" data-i18n="connect.disconnect" hidden></button>
    <p id="message" role="status"></p>
  </main>
  <script src="../dist/profile-form.js"></script>
  <script src="../dist/connection.js"></script>
</body>
</html>
