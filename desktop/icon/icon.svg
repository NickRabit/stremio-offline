<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- The web favicon, laid out on Apple's macOS icon grid: an 824 px rounded square centred on a
       1024 px canvas, with the soft shadow macOS icons carry. -->
  <defs>
    <linearGradient id="g" x1="170" y1="100" x2="854" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5b38"/>
      <stop offset="1" stop-color="#a83c79"/>
    </linearGradient>
    <linearGradient id="shine" x1="512" y1="100" x2="512" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity=".32"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#g)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>
  <g transform="translate(512 512)" fill="none" stroke="#f1f4f8" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <circle r="210"/>
    <polygon points="-52 -96 110 0 -52 96" fill="#f1f4f8"/>
  </g>
</svg>
